# CI 构建 → 发布 Release 产物
# 触发方式:推送 v 开头的 tag,如 git tag v1.0.0 && git push origin v1.0.0
# 服务器端执行 /yepeng/web/piwork.net/deploy.sh 拉取运行
name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch: {} # 手动触发仅验证构建,不发 Release

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  build-release:
    runs-on: ubuntu-latest # 7GB 内存,构建不受服务器 3.5GB 限制
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 从 package.json 的 packageManager 读取版本

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 恢复 Next.js 构建缓存
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建(生产)
        run: pnpm build
        # 注:CI 环境无 POSTGRES_URL,build 前置的 db migrate 会自动跳过,
        # 数据库迁移在服务器部署时由 deploy.sh 执行。
        # 若构建期需要其他环境变量,在仓库 Secrets 配置后在此透传。

      - name: 写入 release 元数据
        run: |
          printf 'release=%s\ngit=%s\nbuilt_at=%s\n' \
            "${GITHUB_REF_NAME:-manual}" \
            "${GITHUB_SHA}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .release-info

      - name: 打包部署产物
        run: |
          # 先写到目录外再移回：直接在打包目标里落盘会让 GNU tar 报
          # "file changed as we read it" 并以 exit 1 失败
          tar -czf /tmp/piwork.tar.gz \
            --exclude='./node_modules' \
            --exclude='./.git' \
            --exclude='./.next/cache' \
            --exclude='./.env.local' \
            --exclude='._*' \
            .
          mv /tmp/piwork.tar.gz piwork.tar.gz
          ls -lh piwork.tar.gz

      - name: 保存构建缓存(加速下次构建)
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ github.sha }}

      - name: 创建 GitHub Release 并附加产物
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: piwork.tar.gz
          generate_release_notes: true
